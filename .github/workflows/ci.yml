name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      - name: Go mod tidy check
        run: cd api && go mod tidy && git diff --exit-code go.mod go.sum

      - name: Go fmt check
        run: |
          cd api
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: cd api && go vet ./...

      - name: Go build
        run: cd api && go build ./...

      - name: Go test
        run: cd api && go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_CI_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_CI_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_CI_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_CI_PASSWORD }}
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          POSTGRES_CI_USER: ${{ secrets.POSTGRES_CI_USER }}
          POSTGRES_CI_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD }}
          POSTGRES_CI_DB: ${{ secrets.POSTGRES_CI_DB }}
        run: |
          cd api
          psql "postgres://${POSTGRES_CI_USER}:${POSTGRES_CI_PASSWORD}@localhost:5432/${POSTGRES_CI_DB}?sslmode=disable" \
            -f migrations/001_initial.sql

      - name: Build and start backend
        env:
          POSTGRES_CI_USER: ${{ secrets.POSTGRES_CI_USER }}
          POSTGRES_CI_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD }}
          POSTGRES_CI_DB: ${{ secrets.POSTGRES_CI_DB }}
          MINIO_CI_USER: ${{ secrets.MINIO_CI_USER }}
          MINIO_CI_PASSWORD: ${{ secrets.MINIO_CI_PASSWORD }}
          MINIO_CI_BUCKET: ${{ secrets.MINIO_CI_BUCKET }}
        run: |
          cd api
          go build -o ../replay-api ./cmd/server
          cd ..
          DATABASE_URL="postgres://${POSTGRES_CI_USER}:${POSTGRES_CI_PASSWORD}@localhost:5432/${POSTGRES_CI_DB}?sslmode=disable" \
          MINIO_ENDPOINT="localhost:9000" \
          MINIO_ACCESS_KEY="${MINIO_CI_USER}" \
          MINIO_SECRET_KEY="${MINIO_CI_PASSWORD}" \
          MINIO_BUCKET="${MINIO_CI_BUCKET}" \
          ./replay-api &
          
          # Wait for backend to be healthy
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done

      - name: Test session registration
        run: |
          curl -s -X POST http://localhost:8080/api/sessions \
            -H "Content-Type: application/json" \
            -d '{"sessionId": "test-ci", "application": "ci", "environment": "test", "url": "http://localhost"}' \
            | jq -e '.sessionId == "test-ci"'

      - name: Test chunk upload and retrieval
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/api/chunks \
            -H "Content-Type: application/json" \
            -d '{"sessionId": "test-ci", "chunkIndex": 0, "fileSize": 10}')
          echo "$RESPONSE" | jq -e '.uploadUrl != null'
          
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.uploadUrl')
          echo "test" > test.gz
          curl -s -X PUT "$UPLOAD_URL" --data-binary @test.gz -H "Content-Type: application/gzip"
          
          curl -s http://localhost:8080/api/sessions/test-ci/chunks | jq -e '.chunks | length == 1'

      - name: Test session completion
        run: |
          curl -s -X POST http://localhost:8080/api/sessions/test-ci/complete \
            -H "Content-Type: application/json" \
            -d '{"totalChunks": 1, "durationMs": 5000}' \
            | jq -e '.status == "completed"'
