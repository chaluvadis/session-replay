<!DOCTYPE html>
<html>
<head>
  <title>DumbPipe - Session Replay</title>
  <meta charset="utf-8">
  <script type="text/javascript">
    // SPA fallback for GitHub Pages: preserve the original path in
    // sessionStorage, then redirect to the app root. The app reads
    // sessionStorage on load and navigates to the preserved route.
    (function () {
      var p = window.location.pathname;
      if (p && p !== '/' && p.indexOf('.') === -1) {
        sessionStorage.setItem('spa-redirect', p);
      }
      window.location.replace('/session-replay/');
    })();
  </script>
</head>
<body></body>
</html>
