# fly.toml
app = "dumbpipe-api"
primary_region = "bom"

[build]
  # If fly.toml is at the ROOT of your repo, use "api/Dockerfile"
  # If fly.toml is INSIDE the api/ folder, use "Dockerfile"
  dockerfile = "Dockerfile" 

[env]
  PORT = "8080"
  MINIO_BUCKET = "session-replays"
  MINIO_REGION = "auto"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"